<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepuH — an engineering identity you can verify</title>
<meta name="description" content="RepuH reads the work you already did and states what it can support — with confidence and limitations attached. Drag to spin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f16;
    --ink:#f4f3f0;
    --dim:rgba(244,243,240,.60);
    --faint:rgba(244,243,240,.40);
    --line:rgba(255,255,255,.12);
    --line-2:rgba(255,255,255,.20);
    --pad:clamp(20px,3.4vw,52px);
  }
  *{box-sizing:border-box}
  html{ -webkit-text-size-adjust:100% }
  html,body{margin:0;background:var(--bg)}
  body{
    color:var(--ink); height:100dvh; overflow:hidden; overscroll-behavior:none;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  a{color:inherit;text-decoration:none}

  /* the gallery owns the whole frame; the copy is kept out of its circle */
  .stage{ position:fixed; inset:0; z-index:0 }
  #orb{ position:absolute; inset:0; width:100%; height:100%; display:block;
        cursor:grab; touch-action:none }
  #orb.dragging{ cursor:grabbing }

  /* ---------- navigation ---------- */
  .nav{
    position:relative; z-index:3;
    display:flex; align-items:center; gap:clamp(20px,3vw,44px);
    padding:clamp(18px,2.3vw,28px) var(--pad);
  }
  .logo{ display:flex; align-items:center; gap:10px; font-weight:500;
         letter-spacing:-.022em; font-size:17px; flex:0 0 auto }
  .logo svg{ width:23px; height:23px; flex:0 0 auto }
  .links{ display:flex; gap:clamp(16px,2vw,30px); margin-left:6px }
  .links a{ font-size:14.5px; color:var(--dim); transition:color .2s ease }
  .links a:hover{ color:var(--ink) }
  .navend{ margin-left:auto; display:flex; align-items:center; gap:clamp(12px,1.6vw,22px) }
  .navend .sign{ font-size:14.5px; color:var(--dim); transition:color .2s ease }
  .navend .sign:hover{ color:var(--ink) }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
        border-radius:999px; font-weight:500; letter-spacing:-.012em; white-space:nowrap;
        transition:transform .3s cubic-bezier(.2,.7,.3,1), background .25s ease, border-color .25s ease }
  .btn:active{ transform:translateY(1px) }
  .btn.sm{ font-size:14px; padding:9px 17px }
  .btn.lg{ font-size:15.5px; padding:13px 25px }
  .btn.solid{ background:var(--ink); color:#17171a }
  .btn.solid:hover{ background:#fff }
  .btn.ghost{ border:1px solid var(--line-2); color:var(--ink) }
  .btn.ghost:hover{ border-color:rgba(255,255,255,.42); background:rgba(255,255,255,.05) }
  .btn .arrow{ transition:transform .3s cubic-bezier(.2,.7,.3,1) }
  .btn:hover .arrow{ transform:translateX(3px) }

  /* ---------- drag / hover affordance, under the nav ---------- */
  .hint{
    position:relative; z-index:3; width:fit-content;    margin:clamp(14px,2.5vh,30px) auto 0;
    display:flex; align-items:center; gap:9px;
    padding:8px 15px 8px 11px; border-radius:999px;
    background:rgba(11,15,22,.78); border:1px solid var(--line);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    font-size:12.5px; color:var(--faint); letter-spacing:-.004em;
    transition:opacity .5s ease, transform .5s ease; pointer-events:none;
  }
  .hint svg{ width:14px; height:14px }
  .hint.gone{ opacity:0; transform:translateY(5px) }

  /* ---------- the copy, pinned to the two bottom corners ---------- */
  .band{
    position:fixed; left:0; right:0; bottom:0; z-index:3;
    display:grid; grid-template-columns:1fr 1fr; align-items:end;
    gap:clamp(24px,4vw,80px);
    padding:0 var(--pad) clamp(24px,4.4vh,52px);
  }
  .lead{
    grid-column:1; justify-self:start; margin:0; font-weight:600;
    font-size:clamp(40px,5.2vw,78px); line-height:.98; letter-spacing:-.042em;
  }
  .lead em{ font-family:"Instrument Serif",Georgia,serif; font-style:italic;
            font-weight:400; letter-spacing:-.008em; margin-right:-.05em }
  .side{ grid-column:2; justify-self:end; max-width:min(100%,390px) }

  .badge{ display:inline-flex; align-items:center; gap:9px;
          padding:5px 13px 5px 10px; border-radius:999px;
          border:1px solid var(--line); background:rgba(255,255,255,.045);
          font-size:12.5px; color:var(--dim); letter-spacing:-.006em }
  .badge i{ width:6px; height:6px; border-radius:999px; background:#4ade80;
            box-shadow:0 0 0 3px rgba(74,222,128,.18) }
  .lede{ margin:13px 0 0; font-size:clamp(14.5px,1.05vw,15.5px);
         line-height:1.48; color:var(--dim); letter-spacing:-.006em }
  .cta{ display:flex; flex-wrap:wrap; gap:10px; margin-top:17px }
  .proof{ display:flex; align-items:center; gap:12px; margin-top:17px }
  .avatars{ display:flex }
  .avatars img{ width:30px; height:30px; border-radius:999px; margin-left:-9px;
                border:2px solid var(--bg); object-fit:cover; display:block }
  .avatars img:first-child{ margin-left:0 }
  .proof .chip{ display:inline-flex; align-items:center; padding:5px 11px; border-radius:999px;
                border:1px solid var(--line); background:rgba(255,255,255,.045);
                font-size:12px; letter-spacing:-.004em; color:var(--dim); white-space:nowrap }
  
  @media (max-width:980px){ .links{ display:none } }

  /* ---------- stacked ---------- */
  @media (max-width:900px){
    body{ height:auto; min-height:100dvh; overflow-y:auto;
          display:flex; flex-direction:column }
    .stage{ position:relative; inset:auto; order:3;
            width:100%; flex:1 1 auto; min-height:min(42dvh,340px) }
    .nav{ order:1 }
    .band{ display:contents }
    .lead{ order:2; padding:clamp(6px,2vh,18px) var(--pad) 0;
           font-size:clamp(36px,9.2vw,54px) }
    .hint{ order:4; margin:clamp(6px,1.4vh,14px) auto 0 }
    .side{ order:5; justify-self:auto; max-width:none;
           padding:clamp(14px,2.6vh,26px) var(--pad) clamp(24px,4vh,40px) }
    .lede{ max-width:46ch }
  }
  @media (max-width:420px){ .navend .sign{ display:none } }
  @media (prefers-reduced-motion:reduce){ .btn,.btn .arrow,.hint{ transition:none } }
</style>
</head>
<body>

<div class="stage">
  <canvas id="orb"></canvas>
</div>

<div class="hint" id="hint" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linejoin="round" stroke-linecap="round">
    <path d="M7.2 2.9 L16.4 10.6 L11.6 11.2 L13.9 15.5 L11.6 16.7 L9.3 12.4 L6.6 15.3 Z"/>
    <path d="M12 17.3 v2.2"/><ellipse cx="12" cy="20.5" rx="5.4" ry="1.7"/>
  </svg>
  Drag to spin &middot; hover a screen
</div>

<script src="/three/three.min.js"></script>
<script>
/* ============================================================
   RepuH — a sphere of evidence screens
   Every plate is a procedurally drawn RepuH product screen: skill
   estimates, evidence records, certificates, anchors, consents.
   ============================================================ */

/* ---------- deterministic rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.min(a.length-1,(r()*a.length)|0)];
const rr=(r,a,b)=>a+r()*(b-a);

/* ============================================================
   atlas — 96 RepuH product screens, painted procedurally
   ============================================================ */
/* Every plate is one of the product's real views — skill estimates,
   evidence records, certificates, anchors, consent — drawn in the
   app palette so the sphere reads as a sphere of THIS platform. */
const TW=384, TH=256, COLS=12, ROWS=8, TILES=COLS*ROWS;
const atlasCanvas=document.createElement('canvas');
atlasCanvas.width=TW*COLS; atlasCanvas.height=TH*ROWS;

const P={bg:'#0b0f16',surface:'#111826',muted:'#18202f',fg:'#edf1f7',
         dim:'rgba(237,241,247,.62)',faint:'rgba(237,241,247,.36)',
         line:'rgba(255,255,255,.09)',primary:'#7c9dff',accent:'#35d3ae',
         warn:'#d9a441',danger:'#e07076'};
const SKILLS=['TypeScript','React','Python','Next.js','CI/CD','Docker','SQL',
              'Accessibility','Code review','Documentation','State management',
              'Project collaboration','Technical communication','UI implementation',
              'Deployment','Database engineering'];
const NAMES=['Priya Nair','Diego Salas','Lena Fischer','Marcus Oyelaran','Aisha Rahman','Tomas Beck'];
const SIGNALS=['Pull request merged','Code review','Commit series','Documentation','Issue resolved','Release'];
const PROJECTS=['demo-ui','demo-service','repuh-demo-work'];
const EST=[79,81,83,86,88,74];
const MONO='ui-monospace, SFMono-Regular, Menlo, monospace';

function pr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function panel(g){pr(g,8,8,368,240,14);g.fillStyle=P.surface;g.fill();g.strokeStyle=P.line;g.lineWidth=1;g.stroke();}
function txt(g,s,x,y,o){o=o||{};g.fillStyle=o.c||P.fg;g.font=(o.w||500)+' '+(o.s||13)+'px '+(o.f||'Inter, system-ui, sans-serif');g.textAlign=o.a||'left';g.fillText(s,x,y);}
function chip(g,label,x,y,o){o=o||{};const fs=o.s||10.5;g.font='500 '+fs+'px Inter, system-ui, sans-serif';const w=g.measureText(label).width+16;pr(g,x,y,w,20,10);g.fillStyle=o.bg||'rgba(255,255,255,.05)';g.fill();g.strokeStyle=o.c||P.line;g.lineWidth=1;g.stroke();g.fillStyle=o.c||P.dim;g.textAlign='left';g.fillText(label,x+8,y+14);return w;}
function chipR(g,label,right,y,o){o=o||{};const fs=o.s||10.5;g.font='500 '+fs+'px Inter, system-ui, sans-serif';const w=g.measureText(label).width+16;return chip(g,label,right-w,y,o);}
function bar(g,x,y,w,frac,c){pr(g,x,y,w,5,2.5);g.fillStyle='rgba(255,255,255,.07)';g.fill();if(frac>0.04){pr(g,x,y,Math.max(8,w*frac),5,2.5);g.fillStyle=c||P.primary;g.fill();}}
function hexs(r,n){let s='';for(let i=0;i<n;i++)s+='0123456789abcdef'[(r()*16)|0];return s;}
function dot(g,x,y,rad,c){g.beginPath();g.arc(x,y,rad,0,6.284);g.fillStyle=c;g.fill();}

/* --- 1. skill estimates ---------------------------------- */
function fSkills(g,r){
  panel(g);
  txt(g,pick(r,['Programming','Backend engineering','Delivery','Data']),24,40,{s:16,w:600});
  txt(g,'3 of 6 estimated',24,58,{s:11.5,c:P.faint});
  let y=86;
  for(let i=0;i<3;i++){
    const sts=[['Established',P.accent],['Provisional',P.primary],['No evidence',P.faint]][(r()*3)|0];
    txt(g,pick(r,SKILLS),24,y+14,{s:13});
    chipR(g,sts[0],360,y,{c:sts[1]});
    bar(g,24,y+27,150,(55+((r()*44)|0))/100,sts[1]);
    txt(g,'~'+pick(r,EST)+'%',184,y+33,{s:12,w:600,c:P.dim});
    y+=52;
  }
}

/* --- 2. evidence record ---------------------------------- */
function fEvidence(g,r){
  panel(g);
  chip(g,'DEMO',24,26,{c:P.accent,bg:'rgba(53,211,174,.10)'});
  txt(g,pick(r,SIGNALS)+' \u00b7 '+pick(r,PROJECTS),24,70,{s:15,w:600});
  txt(g,'test-user/'+pick(r,PROJECTS)+' \u00b7 3mo ago',24,90,{s:11.5,c:P.faint});
  let x=24;
  for(let i=0;i<3;i++)x+=chip(g,pick(r,SKILLS),x,108,{c:P.dim,s:10})+8;
  txt(g,'Files touched: src/auth/session.ts',24,162,{s:12,c:P.dim});
  txt(g,'Signals counted: 1 \u2014 quality 0.73',24,182,{s:12,c:P.dim});
  chipR(g,'Inspect',360,206,{c:P.primary});
}

/* --- 3. evidence certificate ----------------------------- */
function fCertificate(g,r){
  panel(g);
  txt(g,'EVIDENCE CERTIFICATE',24,36,{s:9.5,w:600,c:P.faint});
  txt(g,pick(r,SKILLS),24,66,{s:19,w:600});
  txt(g,'ESTIMATE',24,96,{s:9,w:600,c:P.faint});
  txt(g,'CONFIDENCE',150,96,{s:9,w:600,c:P.faint});
  txt(g,'STATUS',270,96,{s:9,w:600,c:P.faint});
  txt(g,'~'+pick(r,EST)+'%',24,120,{s:17,w:600});
  txt(g,(60+((r()*35)|0))+'%',150,120,{s:17,w:600});
  txt(g,'established',270,120,{s:17,w:600,c:P.accent});
  txt(g,'0x'+hexs(r,10)+'\u2026'+hexs(r,6),24,152,{s:11,w:400,c:P.faint,f:MONO});
  txt(g,'Not anchored \u2014 Hedera not configured',24,180,{s:11.5,c:P.warn});
  chipR(g,'Verify \u2197',360,202,{c:P.primary});
}

/* --- 4. activity feed ------------------------------------ */
function fActivity(g,r){
  panel(g);
  txt(g,'Activity',24,40,{s:16,w:600});
  const titles=['PR #342 merged into demo-ui','Review on demo-service','Pushed 4 commits to auth/','Comment on issue #88','Release v1.4 tagged','Docs page updated'];
  let y=70;
  for(let i=0;i<4;i++){
    if(i<3){g.fillStyle=P.line;g.fillRect(28.5,y+8,1,38);}
    dot(g,29,y+11,3.5,i===0?P.accent:P.primary);
    txt(g,pick(r,titles),46,y+15,{s:12.5});
    txt(g,pick(r,['3mo ago','2w ago','5d ago','yesterday']),360,y+15,{s:11,c:P.faint,a:'right'});
    y+=40;
  }
  chip(g,'DEMO DATA',24,212,{c:P.warn,s:9.5});
}

/* --- 5. onboarding step ---------------------------------- */
function fOnboarding(g,r){
  panel(g);
  txt(g,'0'+(1+((r()*6)|0))+' / 06',24,46,{s:26,w:600,c:P.primary});
  txt(g,pick(r,['Identity','Extension','First evidence','Review']),24,76,{s:16,w:600});
  txt(g,'What should employers call you?',24,106,{s:11.5,c:P.faint});
  pr(g,24,118,336,34,8);g.fillStyle=P.muted;g.fill();g.strokeStyle=P.line;g.stroke();
  txt(g,'Lena Fischer',36,140,{s:13});
  txt(g,'Your profile starts private \u2014 you choose what to share.',24,178,{s:11.5,c:P.faint});
  chipR(g,'Continue \u2192',360,206,{c:P.primary,bg:'rgba(124,157,255,.10)'});
}

/* --- 6. merkle commitment -------------------------------- */
function fMerkle(g,r){
  panel(g);
  txt(g,'Evidence commitment',24,36,{s:13,w:600,c:P.dim});
  const leaves=[52,146,240], top=64, lw=54;
  leaves.forEach(x=>{pr(g,x,top,lw,20,5);g.fillStyle=P.muted;g.fill();g.strokeStyle=P.line;g.stroke();});
  const mid=[99,193];
  mid.forEach(x=>{pr(g,x,110,lw,20,5);g.fillStyle=P.muted;g.fill();g.strokeStyle=P.line;g.stroke();});
  g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=1;
  [[0,0],[1,0],[2,1]].forEach(([li,mi])=>{g.beginPath();g.moveTo(leaves[li]+lw/2,top+20);g.lineTo(mid[mi]+lw/2,110);g.stroke();});
  g.beginPath();g.moveTo(mid[0]+lw/2,130);g.lineTo(189,158);g.stroke();
  g.beginPath();g.moveTo(mid[1]+lw/2,130);g.lineTo(189,158);g.stroke();
  pr(g,140,158,98,22,5);g.fillStyle='rgba(53,211,174,.10)';g.fill();g.strokeStyle=P.accent;g.stroke();
  txt(g,'root',189,173,{s:10.5,w:600,c:P.accent,a:'center'});
  txt(g,'0x'+hexs(r,16),189,208,{s:10.5,w:400,c:P.faint,a:'center',f:MONO});
  chip(g,'Merkle leaf set',24,198,{c:P.dim,s:10});
}

/* --- 7. leaderboard -------------------------------------- */
function fLeader(g,r){
  panel(g);
  txt(g,'Leaderboard \u2014 Programming',24,36,{s:13,w:600,c:P.dim});
  chipR(g,'DEMO',360,24,{c:P.warn,s:9.5});
  let y=64;
  for(let i=0;i<4;i++){
    txt(g,'#'+(i+1),24,y+14,{s:12,w:600,c:P.faint});
    txt(g,pick(r,NAMES),52,y+14,{s:13});
    chipR(g,'~'+pick(r,EST),360,y,{c:P.primary});
    bar(g,52,y+27,200,0.4+((r()*6)|0)/10,P.primary);
    y+=44;
  }
}

/* --- 8. visibility radios -------------------------------- */
function fVisibility(g,r){
  panel(g);
  txt(g,'Profile visibility',24,40,{s:16,w:600});
  const opts=[['Private','Only you can see this profile'],
              ['Selectively shared','People you approve can view it'],
              ['Public','Anyone with the link can view it']];
  const sel=(r()*3)|0;
  let y=74;
  opts.forEach((o,i)=>{
    g.beginPath();g.arc(34,y+8,7,0,6.284);g.strokeStyle=i===sel?P.primary:P.line;g.lineWidth=1.6;g.stroke();
    if(i===sel){g.beginPath();g.arc(34,y+8,3.2,0,6.284);g.fillStyle=P.primary;g.fill();}
    txt(g,o[0],54,y+12,{s:13,w:i===sel?600:500});
    txt(g,o[1],54,y+28,{s:10.5,c:P.faint});
    y+=54;
  });
}

/* --- 9. public profile header ---------------------------- */
function fProfile(g,r){
  panel(g);
  const name=pick(r,NAMES);
  g.beginPath();g.arc(52,56,22,0,6.284);g.fillStyle=P.muted;g.fill();g.strokeStyle=P.line;g.stroke();
  txt(g,name.split(' ').map(w=>w[0]).join(''),52,62,{s:15,w:600,c:P.primary,a:'center'});
  txt(g,name,88,52,{s:17,w:600});
  txt(g,'@'+name.toLowerCase().replace(/[^a-z]/g,'-'),88,70,{s:11.5,c:P.faint});
  let x=24;
  x+=chip(g,'Public profile',x,100,{c:P.dim,s:10})+8;
  chip(g,'DEMO data',x,100,{c:P.warn,s:10});
  const stats=[['53','evidence'],['3','projects'],['6','sources']];
  stats.forEach((s,i)=>{const sx=24+i*112;txt(g,s[0],sx,172,{s:20,w:600});txt(g,s[1],sx,190,{s:10.5,c:P.faint});});
}

/* --- 10. category grid ----------------------------------- */
function fCategory(g,r){
  panel(g);
  txt(g,pick(r,['Backend engineering','Design engineering','Delivery','Data engineering']),24,40,{s:15,w:600});
  txt(g,'1 of 6 estimated',24,58,{s:11,c:P.faint});
  for(let i=0;i<6;i++){
    const cx=24+(i%2)*168, cy=76+((i/2)|0)*54;
    pr(g,cx,cy,156,44,8);g.fillStyle=P.muted;g.fill();g.strokeStyle=P.line;g.stroke();
    txt(g,pick(r,SKILLS),cx+12,cy+20,{s:12});
    bar(g,cx+12,cy+30,100,(1+((r()*9)|0))/10,P.primary);
    txt(g,(1+((r()*9)|0))+'',cx+144,cy+20,{s:10.5,c:P.faint,a:'right'});
  }
}

/* --- 11. big stat ---------------------------------------- */
function fBigStat(g,r){
  panel(g);
  txt(g,'53',24,124,{s:60,w:600});
  txt(g,'evidence records',24,150,{s:14,c:P.dim});
  txt(g,'across 3 projects \u00b7 all labelled DEMO',24,170,{s:11,c:P.faint});
  const bars=[34,52,28,66,44,58,72];
  bars.forEach((h,i)=>{const bx=248+i*16;pr(g,bx,196-h,10,h,3);g.fillStyle=i===6?P.accent:'rgba(124,157,255,.45)';g.fill();});
  chip(g,'DEMO DATA',24,198,{c:P.warn,s:9.5});
}

/* --- 12. Hedera anchor ----------------------------------- */
function fAnchor(g,r){
  panel(g);
  txt(g,'HEDERA CONSENSUS',24,36,{s:9.5,w:600,c:P.faint});
  const rows=[['Topic','0.0.5543211'],['Sequence','#'+(1200+((r()*99)|0))],
              ['Consensus','2026-06-14 09:31 UTC'],['Status','Anchored on Hedera testnet']];
  let y=68;
  rows.forEach((row,i)=>{
    txt(g,row[0],24,y,{s:11.5,c:P.faint});
    txt(g,row[1],360,y,{s:12,w:i===3?600:500,c:i===3?P.accent:P.fg,a:'right'});
    g.fillStyle=P.line;g.fillRect(24,y+10,336,1);
    y+=34;
  });
  chipR(g,'HashScan \u2197',360,196,{c:P.primary});
}

/* --- 13. consents ---------------------------------------- */
function fConsent(g,r){
  panel(g);
  txt(g,'Consents',24,40,{s:16,w:600});
  txt(g,'Granted \u00b7 revoke at any time',24,58,{s:11,c:P.faint});
  const purposes=['github_observation','repo_analysis','public_profile','digest_email'];
  let y=84;
  purposes.slice(0,3).forEach(p=>{
    txt(g,p,24,y+14,{s:12.5,f:MONO});
    const on=r()>0.25;

}

const FAMS=[fSkills,fEvidence,fCertificate,fActivity,fOnboarding,fMerkle,fLeader,fVisibility,
            fProfile,fCategory,fBigStat,fAnchor,fConsent,fNodeMap,fLink,fIntegrations];

function drawRepuhAtlas(ac){
  const r=mulberry32(90210);
  for(let i=0;i<TILES;i++){
    const x=(i%COLS)*TW, y=((i/COLS)|0)*TH;
    ac.save();ac.beginPath();ac.rect(x,y,TW,TH);ac.clip();ac.translate(x,y);
    ac.fillStyle=P.bg;ac.fillRect(0,0,TW,TH);
    ac.textBaseline='alphabetic';
    FAMS[i%FAMS.length](ac,r);
    ac.restore();
  }
}

async function buildAtlas(){
  const ac=atlasCanvas.getContext('2d');
  try{
    if(document.fonts&&document.fonts.load){
      await document.fonts.load('600 20px Inter');
      await document.fonts.ready;
    }
  }catch(e){}
  drawRepuhAtlas(ac);
  return TILES;
}
/* ============================================================
   sphere of cards
   ============================================================ */
const SPHERE={
  R:1,
  nEquator:20,      /* cells around the equator */
  latLimit:84,      /* rings stop short of the poles */
  gap:0.10          /* fraction of each cell left as breathing room */
};
/* aspects stay near the 4:3 plate so the UI inside is never badly cropped */
const ASPECTS=[1.62,1.56,1.50,1.50,1.50,1.44,1.38,1.32];

/* One card per lattice cell, sized so its rolled footprint always fits inside
   that cell. Two cards therefore never share a direction from the centre, so
   they cannot intersect — and since a card may only be pushed outward (never
   in), the extra radius shrinks its footprint and keeps the guarantee. */
function buildCards(){
  const r=mulberry32(424242), out=[];
  const lim=SPHERE.latLimit*Math.PI/180;
  const cellEq=2*Math.PI/SPHERE.nEquator;
  const nRings=Math.max(1,Math.round((lim*2)/(cellEq/1.5)));
  const pitch=(lim*2)/nRings;
  for(let j=0;j<=nRings;j++){
    const lat=-lim+j*pitch;
    const cl=Math.max(0.05,Math.cos(lat));
    const n=Math.max(1,Math.round(SPHERE.nEquator*cl));
    const cellW=2*Math.PI*cl/n, cellH=pitch;
    const maxW=cellW*(1-SPHERE.gap), maxH=cellH*(1-SPHERE.gap);
    const off=r()*Math.PI*2;
    for(let i=0;i<n;i++){
      const asp=pick(r,ASPECTS);
      const roll=rr(r,-0.045,0.045);                     /* <= 2.6 deg */
      const ca=Math.cos(roll), sa=Math.abs(Math.sin(roll));
      let w=Math.min(maxW/(ca+sa/asp), maxH/(ca/asp+sa));
      w*=rr(r,0.86,0.96);   /* headroom the hover pop grows into */
      const h=w/asp;
      /* slide only into the slack the cell has left over */
      const slackLon=Math.max(0,(cellW-(w*ca+h*sa))/2);
      out.push({
        lat:lat,
        lon:off+(i/n)*Math.PI*2+(slackLon/cl)*rr(r,-0.85,0.85),
        rad:SPHERE.R*(1+rr(r,0,0.02)),
        w:w, h:h, roll:roll, tile:0
      });
    }
  }
  /* shuffle, then push repeats of the same plate apart on the sphere */
  const idx=out.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const k=(r()*(i+1))|0;[idx[i],idx[k]]=[idx[k],idx[i]]}
  idx.forEach((o,i)=>{ out[o].tile=i%TILES });
  const dir=out.map(c=>{const cl=Math.cos(c.lat);
    return [cl*Math.sin(c.lon), Math.sin(c.lat), cl*Math.cos(c.lon)]});
  const MIND=Math.cos(0.62);                 /* ~35 deg of arc */
  const clash=i=>{
    for(let j=0;j<out.length;j++){
      if(j===i||out[j].tile!==out[i].tile)continue;
      const d=dir[i][0]*dir[j][0]+dir[i][1]*dir[j][1]+dir[i][2]*dir[j][2];
      if(d>MIND)return true;
    }
    return false;
  };
  for(let pass=0;pass<4;pass++){
    for(let i=0;i<out.length;i++){
      if(!clash(i))continue;
      for(let t=0;t<24;t++){
        const k=(r()*out.length)|0; if(k===i)continue;
        const a=out[i].tile,b=out[k].tile;
        out[i].tile=b; out[k].tile=a;
        if(!clash(i)&&!clash(k))break;
        out[i].tile=a; out[k].tile=b;
      }
    }
  }
  return out;
}

/* outline of a rounded rect, CCW, in local card space */
function cardOutline(w,h,rad,seg){
  const a=w/2,b=h/2,q=Math.min(rad,a*.9,b*.9),pts=[];
  const corners=[[ a-q, b-q, 0],[-a+q, b-q, Math.PI/2],[-a+q,-b+q, Math.PI],[ a-q,-b+q, -Math.PI/2]];
  for(const[cx,cy,a0]of corners){
    for(let s=0;s<=seg;s++){
      const t=a0+(s/seg)*(Math.PI/2);
      pts.push([cx+Math.cos(t)*q, cy+Math.sin(t)*q]);
    }
  }
  return pts;
}

let renderer,scene,camera,orbGroup,atlasTex,cardMesh,CARDS=null;
let yaw=0,pitch=0,yawVel=0,pitchVel=0,dragging=false,lastPointer=null;
/* ---- hover ---- */
const canHover=!window.matchMedia||window.matchMedia('(hover:hover) and (pointer:fine)').matches;
const HOVER_POP=1.12;                 /* lift and scale share one factor */
const raycaster=new THREE.Raycaster();
const ndc=new THREE.Vector2();
const hoverBall=new THREE.Sphere(new THREE.Vector3(),1.06);
const hitPt=new THREE.Vector3();
let hoverPos=null, hoverIdx=-1, dimT=0, slowT=0;
let hoverT=null, live=new Set();
const AUTO=Math.PI*2/20;              /* one full turn every 20 seconds */
const canvas=document.getElementById('orb');
const hintEl=document.getElementById('hint');
/* The hero is the page's own: this document owns only the sphere and the
   drag hint, so there is no in-frame nav or copy to fit around. */

/* how far the viewport centre is from an element's box — the orb grows until
   it touches the nearest piece of copy, so nothing can ever sit on top of it */
const stacked=()=>window.innerWidth<=900;

function clearTo(cx,cy,el){
  const r=el.getBoundingClientRect();
  const dx=Math.max(r.left-cx, 0, cx-r.right);
  const dy=Math.max(r.top-cy, 0, cy-r.bottom);
  return Math.hypot(dx,dy);
}

const SEG=7, PER=4*(SEG+1);          /* outline points, and triangles, per card */
let basePos=null, posAttr=null, colAttr=null;

function cardBasis(c){
  const cl=Math.cos(c.lat), sl=Math.sin(c.lat), cs=Math.cos(c.lon), sn=Math.sin(c.lon);
  const n=[cl*sn, sl, cl*cs];
  const u=[-sl*sn, cl, -sl*cs];
  const g=[u[1]*n[2]-u[2]*n[1], u[2]*n[0]-u[0]*n[2], u[0]*n[1]-u[1]*n[0]];
  const cr=Math.cos(c.roll), sr=Math.sin(c.roll);
  return { n,
    R:[g[0]*cr+u[0]*sr, g[1]*cr+u[1]*sr, g[2]*cr+u[2]*sr],
    U:[u[0]*cr-g[0]*sr, u[1]*cr-g[1]*sr, u[2]*cr-g[2]*sr] };
}

/* Writes one card's vertices. A hover both lifts the card outward and scales it
   by the same factor, so its angular footprint is unchanged and it still cannot
   reach into a neighbour's cell. */
function writeCard(pos, c, scale, radMul){
  const b=c.basis, rad=c.rad*radMul;
  const ox=b.n[0]*rad, oy=b.n[1]*rad, oz=b.n[2]*rad;
  let p=c.vBase*3;
  pos[p++]=ox; pos[p++]=oy; pos[p++]=oz;
  for(let i=0;i<c.outline.length;i++){
    const x=c.outline[i][0]*scale, y=c.outline[i][1]*scale;
    pos[p++]=ox+b.R[0]*x+b.U[0]*y;
    pos[p++]=oy+b.R[1]*x+b.U[1]*y;
    pos[p++]=oz+b.R[2]*x+b.U[2]*y;
  }
}

function buildGeometry(cards){
  const vCount=cards.length*(PER+1);
  const pos=new Float32Array(vCount*3);
  const uv =new Float32Array(vCount*2);
  const col=new Float32Array(vCount*3).fill(1);
  const idx=new Uint32Array(cards.length*PER*3);
  const TILEU=1/COLS, TILEV=1/ROWS, INSET=0.5/TW;
  let up=0, ip=0, vbase=0;

  for(const c of cards){
    c.basis=cardBasis(c);
    c.outline=cardOutline(c.w,c.h,c.w*0.065,SEG);
    c.vBase=vbase;
    writeCard(pos,c,1,1);

    const cl=c.tile%COLS, row=(c.tile/COLS)|0;
    const asp=c.w/c.h, tileAsp=TW/TH;
    const us=asp>tileAsp?1:asp/tileAsp;            /* cover-fit into the plate */
    const vs=asp>tileAsp?tileAsp/asp:1;
    uv[up++]=(cl+0.5)*TILEU; uv[up++]=(row+0.5)*TILEV;
    for(let i=0;i<c.outline.length;i++){
      const lu=0.5+(c.outline[i][0]/c.w)*us, lv=0.5+(c.outline[i][1]/c.h)*vs;
      uv[up++]=(cl+Math.min(1-INSET,Math.max(INSET,lu)))*TILEU;
      uv[up++]=(row+(1-Math.min(1-INSET,Math.max(INSET,lv))))*TILEV;
    }
    for(let i=0;i<PER;i++){
      idx[ip++]=vbase; idx[ip++]=vbase+1+i; idx[ip++]=vbase+1+((i+1)%PER);
    }
    vbase+=PER+1;
  }
  basePos=pos;
  const g=new THREE.BufferGeometry();
  posAttr=new THREE.BufferAttribute(pos,3);
  colAttr=new THREE.BufferAttribute(col,3);
  g.setAttribute('position',posAttr);
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setAttribute('color',colAttr);
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.boundingSphere=new THREE.Sphere(new THREE.Vector3(),1.35);
  return g;
}

let fitW=0,fitH=0;
function fitCamera(force){
  const el=canvas.parentElement;
  const W=el.clientWidth, H=el.clientHeight;
  /* a zero-sized container (hidden tab, mid-layout) must not lock in a 2x2 buffer */
  if(W<2||H<2) return;
  if(!force&&W===fitW&&H===fitH) return;
  fitW=W; fitH=H;
  /* camera at 4.0 R (measured from the source); the sphere spans 0.80 of the
     viewport width and is cropped top and bottom, with a floor so that tall
     portrait viewports still read as a full-bleed orb */
  const D=4.0;                                   /* camera distance in radii */
  const alpha=Math.asin(1/D);
  let diameter;
  if(stacked()){
    diameter=Math.min(0.92*W, 0.96*H);           /* stacked: fits inside its own box */
  }else{
    const cx=W/2, cy=H/2;
    let R=Math.min(0.21*W, 0.32*H);
    if(hintEl) R=Math.min(R, clearTo(cx,cy,hintEl)-18);
    diameter=2*Math.max(70,R);
  }
  const halfFov=Math.atan(Math.tan(alpha)*H/diameter);
  camera.fov=Math.max(4,Math.min(100,halfFov*2*180/Math.PI));
  camera.aspect=W/H;
  camera.position.set(0,0,D);
  camera.updateProjectionMatrix();
  orbGroup.position.y=0.40;                       /* sit above the pinned copy */
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(W,H,false);
}

function initGL(){
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.setClearColor(0x000000,0);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(19,1,0.1,60);

  atlasTex=new THREE.CanvasTexture(atlasCanvas);
  atlasTex.flipY=false;
  atlasTex.encoding=THREE.sRGBEncoding;
  atlasTex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  atlasTex.minFilter=THREE.LinearMipmapLinearFilter;
  atlasTex.magFilter=THREE.LinearFilter;
  atlasTex.generateMipmaps=true;
  atlasTex.needsUpdate=true;

  const cards=buildCards();
  CARDS=cards;
  hoverT=new Float32Array(cards.length);
  const geo=buildGeometry(cards);
  const mat=new THREE.MeshBasicMaterial({map:atlasTex,side:THREE.FrontSide,
                                        vertexColors:true,toneMapped:false});
  cardMesh=new THREE.Mesh(geo,mat);
  orbGroup=new THREE.Group();
  orbGroup.add(cardMesh);
  scene.add(orbGroup);

  fitCamera();
  if(window.ResizeObserver) new ResizeObserver(()=>fitCamera()).observe(canvas.parentElement);
  window.addEventListener('resize',()=>fitCamera(true));
  bindPointer();
  requestAnimationFrame(tick);
}

/* ---------- drag ---------- */
function bindPointer(){
  const rad=()=>Math.min(canvas.clientWidth,canvas.clientHeight)||1;
  canvas.addEventListener('pointerdown',e=>{
    dragging=true;hintEl.classList.add('gone');
    canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId);
    lastPointer={x:e.clientX,y:e.clientY};
  });
  canvas.addEventListener('pointermove',e=>{
    if(canHover&&e.pointerType!=='touch'){
      const b=canvas.getBoundingClientRect();
      hoverPos={x:((e.clientX-b.left)/b.width)*2-1, y:-((e.clientY-b.top)/b.height)*2+1};
    }
    if(!dragging||!lastPointer)return;
    const dx=e.clientX-lastPointer.x, dy=e.clientY-lastPointer.y;
    lastPointer={x:e.clientX,y:e.clientY};
    const k=2.6/rad();
    yaw+=dx*k; yawVel=dx*k*60*0.35;
    pitch=Math.max(-0.26,Math.min(0.26,pitch+dy*k*0.55)); pitchVel=dy*k*60*0.2;
  });
  const end=e=>{
    if(!dragging)return;
    dragging=false;canvas.classList.remove('dragging');lastPointer=null;
    try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
  };
  canvas.addEventListener('pointerup',end);
  canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('pointerleave',e=>{ hoverPos=null; end(e); });
}

/* ---------- loop ---------- */
let prev=performance.now();
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(now){
  requestAnimationFrame(tick);
  let dt=(now-prev)/1000; prev=now;
  if(dt>0.1)dt=0.1;
  fitCamera();

  if(!dragging){
    yaw+=(AUTO*(reduce?0:1)*(1-0.78*slowT)+yawVel)*dt;
    yawVel*=Math.pow(0.0016,dt);
    pitch+=pitchVel*dt;
    pitchVel*=Math.pow(0.0016,dt);
    pitch*=Math.pow(0.22,dt);          /* ease the tilt back to level */
  }
  orbGroup.rotation.set(pitch,yaw,0);
  updateHover(dt);
  renderer.render(scene,camera);
}

/* Picks the plate under the pointer, lifts it out of the wall, and settles the
   rest back so the one you are looking at is the brightest thing on screen. */
function updateHover(dt){
  if(!hoverT)return;
  let want=-1;
  if(hoverPos && !dragging && canHover){
    ndc.set(hoverPos.x,hoverPos.y);
    raycaster.setFromCamera(ndc,camera);
    hoverBall.center.copy(orbGroup.position);
    if(raycaster.ray.intersectsSphere(hoverBall)){
      const hit=raycaster.intersectObject(cardMesh,false)[0];
      if(hit&&hit.faceIndex!==undefined) want=Math.floor(hit.faceIndex/PER);
      else if(hoverIdx>=0) want=hoverIdx;      /* hold through a gap as the wall turns */
      else if(raycaster.ray.intersectSphere(hoverBall,hitPt)){
        /* first entry landed in a gap — snap to whichever plate it is nearest */
        orbGroup.worldToLocal(hitPt).normalize();
        let best=-1,bd=-2;
        for(let i=0;i<CARDS.length;i++){
          const n=CARDS[i].basis.n, d=n[0]*hitPt.x+n[1]*hitPt.y+n[2]*hitPt.z;
          if(d>bd){bd=d;best=i}
        }
        want=best;
      }
    }
  }
  if(want!==hoverIdx){
    if(hoverIdx>=0) live.add(hoverIdx);
    if(want>=0) live.add(want);
    hoverIdx=want;
  }

  const ease=1-Math.pow(0.0009,dt);
  dimT  += ((hoverIdx>=0?1:0)-dimT )*ease;
  slowT += ((hoverIdx>=0?1:0)-slowT)*ease;
  const dimTo=1-0.42*dimT;
  cardMesh.material.color.setScalar(dimTo);

  let movedGeo=false, movedCol=false;
  for(const i of Array.from(live)){
    const target=(i===hoverIdx)?1:0;
    const t=hoverT[i]+(target-hoverT[i])*ease;
    hoverT[i]=Math.abs(t-target)<0.0015?target:t;
    const c=CARDS[i], k=1+hoverT[i]*(HOVER_POP-1);
    writeCard(basePos,c,k,k);                 /* same factor: footprint unchanged */
    movedGeo=true;
    const lift=1+hoverT[i]*(1/dimTo-1);
    const col=colAttr.array, v0=c.vBase*3, v1=v0+(PER+1)*3;
    for(let v=v0;v<v1;v++) col[v]=lift;
    movedCol=true;
    if(hoverT[i]===0 && i!==hoverIdx) live.delete(i);
  }
  if(movedGeo) posAttr.needsUpdate=true;
  if(movedCol) colAttr.needsUpdate=true;
}

/* ============================================================
   boot
   ============================================================ */
async function boot(){
  try{
    if(document.fonts&&document.fonts.load){
      await document.fonts.load('500 40px Inter');
      await document.fonts.ready;
    }
  }catch(e){}
  const n=await buildAtlas();
  if(n<TILES) console.warn('only '+n+'/'+TILES+' plates decoded');
  if(window.THREE) initGL();
  else console.warn('three.js failed to load');
}
boot();
</script>
